
name: attend_ease
description: "Attendance management app for companies and employees."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  another_carousel_pro: ^1.0.2
  wolt_modal_sheet: ^0.7.1
  pinput: ^5.0.0
  toastification: ^2.0.0
  lottie: ^3.1.2
  flutter_switch: ^0.3.2
  google_fonts: ^6.2.1
  dio: ^5.6.0
  geolocator: ^13.0.0
  geocoding: ^3.0.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  local_auth: ^2.3.0
  table_calendar: ^3.1.2
  provider: ^6.1.2
  get_it: ^7.7.0
  go_router: ^14.6.3
  zego_uikit_prebuilt_call: ^4.14.5
  pdf: ^3.10.8
  printing: ^5.12.0
  fl_chart: ^1.2.0
  file_picker: ^10.3.8
  csv: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/login_screen/
    - assets/home_screen/
    - assets/animations/
    - assets/location_screen/

  fonts:
    - family: Tansek
      fonts:
        - asset: fonts/Tansek.ttf
    - family: Kumbh
      fonts:
        - asset: fonts/KumbhSans.ttf
    - family: Kumbh-Med
      fonts:
        - asset: fonts/KumbhSans-Medium.ttf
